    <title>Pritam Singh — Contact</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* CONTACT PAGE */

        .contact-page {
            min-height: calc(100vh - 100px);
            padding: 76px 5vw 64px;
            background: #303140;
            color: #fff;
        }

        .contact-shell {
            width: 100%;
            max-width: 1500px;
            margin: 0 auto;
        }

        .contact-heading-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 28px;
            margin-bottom: 38px;
        }

        .contact-heading-row h1 {
            margin: 0;
            color: #fff;
            font-size: clamp(36px, 4.2vw, 60px);
            line-height: 1.05;
            text-transform: uppercase;
        }

        .teams-link {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 54px;
            padding: 0 24px;
            border-radius: 6px;
            background: #6264a7;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
            transition: background .2s ease, transform .2s ease;
        }

        .teams-link:hover {
            background: #4f52a2;
            transform: translateY(-2px);
        }

        .contact-layout {
            display: grid;
            grid-template-columns: minmax(260px, .78fr) minmax(0, 1.22fr);
            gap: clamp(28px, 4vw, 64px);
            align-items: start;
        }

        .contact-intro {
            margin: 0 0 28px;
            color: #fff;
            font-size: 16px;
            line-height: 1.5;
        }

        .contact-links {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .contact-link {
            min-height: 190px;
            background: #f9a817;
            color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            text-align: center;
            text-decoration: none;
            transition: transform .3s ease, background .3s ease, color .3s ease;
        }

        .contact-link span {
            font-size: clamp(20px, 2.3vw, 34px);
            font-weight: 700;
        }

        .contact-link:hover {
            background: #fff;
            color: #111;
            transform: translateY(-4px);
        }

        .contact-link.linkedin:hover {
            background: #0077b5;
            color: #fff;
        }

        .contact-details {
            margin: 32px 0 0;
            font-weight: 700;
            line-height: 1.9;
            overflow-wrap: anywhere;
        }

        .contact-details a {
            color: #fff;
            text-decoration: none;
        }

        .booking-panel {
            min-width: 0;
            overflow: hidden;
            border-radius: 8px;
            background: #fff;
        }

        #my-cal-inline-15min {
            width: 100%;
            min-width: 0;
            height: 700px;
            overflow: auto;
        }

        @media (max-width: 900px) {
            .contact-layout {
                grid-template-columns: 1fr;
            }

            .contact-links {
                max-width: 640px;
            }
        }

        @media (max-width: 600px) {
            .contact-page {
                padding: 54px 22px 42px;
            }

            .contact-heading-row {
                align-items: flex-start;
                flex-direction: column;
                gap: 20px;
                margin-bottom: 30px;
            }

            .contact-heading-row h1 {
                font-size: 38px;
            }

            .contact-links {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .contact-link {
                min-height: 135px;
            }

            #my-cal-inline-15min {
                height: 680px;
            }
        }

    </style>

</head>
